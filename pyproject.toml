[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "si-viewer"
version = "0.1.0"
description = "Viewer and EDX processing GUI for STEM spectrum images (HyperSpy/exSpy backend)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "hyperspy>=2.4",
    "exspy>=0.3",
    "rosettasciio>=0.14",
    # 4D-STEM processing (HyperSpy-native).
    "pyxem>=0.21",
    # Crystal structures: atoms, colours and radii for the 3D view.
    "ase",
    "sparse",
    "tifffile",
    "pillow",
    "fastapi",
    "uvicorn",
    "websockets",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[project.scripts]
si-viewer = "si_viewer.cli:main"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.setuptools.package-data]
si_viewer = ["static/**/*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
