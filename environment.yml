name: si-viewer
channels:
  - conda-forge
dependencies:
  - python=3.12
  - hyperspy>=2.4
  - exspy>=0.3
  - rosettasciio>=0.14
  - sparse            # needed by rsciio to read Velox spectrum streams
  - numba
  - tifffile          # TIFF images and stacks
  - pillow            # thumbnails
  - pyfftw            # fast FFTs for rigidregistration (drift correction)
  - fastapi
  - uvicorn
  - websockets
  - pytest
  - httpx             # FastAPI TestClient
  - cmocean           # kemstem's colormaps
  - pip
  - pip:
      - -e .
      # Drift correction of image stacks: the local rigidRegistration copy,
      # editable so changes to it take effect at once.
      - -e ../rigidRegistration
      # Atomic-resolution analysis (M22): the local kemstem clone, editable;
      # its example images are the Examples menu's kemstem entries.
      - -e ../kemstem
